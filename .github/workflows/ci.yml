name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UE3DualModeConsoleWrapper.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format UE3DualModeConsoleWrapper.slnx --no-restore --verify-no-changes

      - name: Analyze PowerShell
        shell: pwsh
        run: ./scripts/Analyze-PowerShell.ps1 -OutputFormat GitHub

      - name: Build Release
        run: >-
          dotnet build UE3DualModeConsoleWrapper.slnx
          --configuration Release
          --no-restore
          -warnaserror
